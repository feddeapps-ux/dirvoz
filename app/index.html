<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- En el celular Dirvoz se dibuja a 590 px de ancho, igual que en la app Android -->
  <meta name="viewport" id="dvViewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (function () {
      try {
        var m = Math.min(screen.width || 0, screen.height || 0);
        if (m && m < 700) document.getElementById("dvViewport").setAttribute("content", "width=590, user-scalable=no, viewport-fit=cover");
      } catch (e) {}
    })();
  </script>
  <title>Dirvoz</title>
  <meta name="description" content="Dirvoz: habla con quien tienes cerca.">
  <meta name="theme-color" content="#0B0F2A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dirvoz">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://script.google.com">
  <style>
    :root{ --fondo:#0B0F2A; --fondo2:#0F1438; --violeta:#6236FF; --azul:#2E7BFF; --cian:#00C2FF; --texto2:#C7D0FF; --pie:#8F9BD8;
           --lado: min(32.6vw, 200px); }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body{ margin:0; height:100%; background:var(--fondo); overflow:hidden; overscroll-behavior:none; }
    body{ font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff; }
    [hidden]{ display:none !important; }

    #marco{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--fondo);
      padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
    #app{ flex:1 1 auto; width:100%; min-height:0; border:0; display:block; background:var(--fondo); }

    /* Aviso "Instala Dirvoz" (empuja la app, no la tapa) */
    #instalar{ flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px;
      background:var(--fondo2); border-bottom:2px solid var(--azul); font-size:16px; line-height:1.3; }
    #instalar img{ width:40px; height:40px; border-radius:10px; flex:0 0 auto; }
    #instalar p{ margin:0; flex:1 1 auto; color:var(--texto2); }
    #instalar b{ color:#fff; }
    #instalar .btn{ min-height:42px; padding:8px 18px; border:0; border-radius:14px; color:#fff; font-weight:700; font-size:16px; cursor:pointer;
      background:linear-gradient(135deg, var(--violeta), var(--azul) 55%, var(--cian)); flex:0 0 auto; }
    #instalar .x{ width:40px; height:40px; border:0; border-radius:50%; background:rgba(255,255,255,.1); color:#fff; font-size:22px; cursor:pointer; flex:0 0 auto; }
    .compartir-ios{ display:inline-block; width:18px; height:18px; vertical-align:-3px; }

    /* ───────── Splash: copia del splash nativo de la app Android ───────── */
    #splash{ position:fixed; inset:0; z-index:10; overflow:hidden; transition:opacity .3s ease, visibility .3s;
      background:
        radial-gradient(75vw 75vw at 8% 6%, rgba(98,54,255,.43), transparent 70%),
        radial-gradient(80vw 80vw at 95% 95%, rgba(0,194,255,.31), transparent 70%),
        radial-gradient(circle at 50% 40%, #1B2470, var(--fondo) 75%); }
    #splash.fuera{ opacity:0; visibility:hidden; }
    .centro{ position:absolute; left:50%; top:40%; width:0; height:0; }
    .onda{ position:absolute; left:0; top:0; border-radius:50%; padding:3px; transform:translate(-50%,-50%);
      background:linear-gradient(135deg, var(--violeta), var(--azul), var(--cian));
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation:dvOnda 2.1s linear infinite; opacity:0; }
    .onda:nth-child(2){ animation-delay:-1.4s; }
    .onda:nth-child(3){ animation-delay:-.7s; }
    @keyframes dvOnda{
      0%  { width:calc(var(--lado) * 1.1); height:calc(var(--lado) * 1.1); opacity:.92; }
      100%{ width:calc(var(--lado) * 1.1 + 124vw); height:calc(var(--lado) * 1.1 + 124vw); opacity:0; }
    }
    .ondas{ position:absolute; left:0; top:0; opacity:0; animation:dvAparece .01s linear .45s forwards; }
    .brillo{ position:absolute; left:0; top:0; width:calc(var(--lado) * 2.8); height:calc(var(--lado) * 2.8); transform:translate(-50%,-50%);
      border-radius:50%; background:radial-gradient(circle, rgba(46,123,255,.59), rgba(98,54,255,.24) 55%, transparent 70%);
      opacity:0; animation:dvAparece .5s ease forwards, dvRespira 1.43s ease-in-out .5s infinite; }
    @keyframes dvRespira{ 0%,100%{ opacity:.85; } 50%{ opacity:1; } }
    .logo{ position:absolute; left:0; top:0; width:var(--lado); height:var(--lado); margin:calc(var(--lado) / -2) 0 0 calc(var(--lado) / -2);
      animation:dvRebote .75s cubic-bezier(.34,1.7,.6,1) both, dvLate 1.25s ease-in-out .9s infinite; }
    @keyframes dvRebote{ 0%{ transform:scale(.45); opacity:0; } 37%{ opacity:1; } 100%{ transform:scale(1); opacity:1; } }
    @keyframes dvLate{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.025); } }
    .marca{ position:absolute; left:50%; top:calc(40% + var(--lado) / 2 + 9vw); width:min(56vw, 330px); transform:translate(-50%, 33px);
      opacity:0; animation:dvSube .6s cubic-bezier(.2,.7,.3,1) .42s forwards; }
    .frase{ position:absolute; left:0; right:0; text-align:center; margin:0; color:var(--texto2); font-weight:700; letter-spacing:.02em;
      font-size:min(4.4vw, 26px); top:calc(40% + var(--lado) / 2 + 9vw + min(14.6vw, 87px) + 6vw); transform:translateY(20px);
      opacity:0; animation:dvSube .6s cubic-bezier(.2,.7,.3,1) .75s forwards; }
    @keyframes dvSube{ to{ opacity:1; transform:translate(var(--tx, 0), 0); } }
    .marca{ --tx:-50%; }
    @keyframes dvAparece{ to{ opacity:1; } }
    .eq{ position:absolute; left:50%; top:80%; display:flex; align-items:center; gap:min(2vw, 12px); height:min(7.6vw, 45px);
      transform:translate(-50%,-50%); opacity:0; animation:dvAparece .5s ease .95s forwards; }
    .eq i{ display:block; width:min(1.8vw, 11px); height:100%; border-radius:99px; transform:scaleY(.3);
      animation:dvBarra .555s ease-in-out infinite alternate; }
    .eq i:nth-child(1){ background:#6236FF; animation-delay:0s; }
    .eq i:nth-child(2){ background:#4F57FF; animation-delay:-.133s; }
    .eq i:nth-child(3){ background:#317CFF; animation-delay:-.266s; }
    .eq i:nth-child(4){ background:#18A0FF; animation-delay:-.399s; }
    .eq i:nth-child(5){ background:#00C2FF; animation-delay:-.532s; }
    @keyframes dvBarra{ from{ transform:scaleY(.3); } to{ transform:scaleY(1); } }
    .pie{ position:absolute; left:0; right:0; top:92%; transform:translateY(-50%); text-align:center; margin:0;
      color:var(--pie); font-weight:700; letter-spacing:.18em; font-size:min(3.4vw, 20px); opacity:0; animation:dvAparece .6s ease 1.1s forwards; }

    /* Sin conexión (igual que en la app Android) */
    #sin{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
      padding:0 40px; text-align:center; color:var(--texto2); font:600 22px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background:radial-gradient(620px 420px at 50% 40%, #1B2470, var(--fondo)); }
    #sin img{ width:150px; height:150px; }
    #sin b{ color:#fff; font-size:30px; }
    #sin button{ min-height:64px; padding:12px 40px; border:0; border-radius:18px; font:700 22px system-ui, sans-serif; color:#fff; cursor:pointer;
      background:linear-gradient(135deg, var(--violeta), var(--azul) 55%, var(--cian)); }

    #aviso{ position:fixed; left:50%; bottom:calc(110px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:30;
      max-width:min(92vw, 480px); padding:13px 18px; border-radius:14px; background:#FF4D6D; color:#fff; font-weight:600; font-size:17px; }

    @media (prefers-reduced-motion: reduce){ #splash *{ animation-duration:.01s !important; animation-iteration-count:1 !important; } }
  </style>
</head>
<body>
  <div id="marco">
    <div id="instalar" hidden role="region" aria-label="Instalar Dirvoz">
      <img src="icons/icon-192.png" alt="">
      <p id="instalarTexto"></p>
      <button class="btn" id="instalarBtn" type="button" hidden>Instalar</button>
      <button class="x" id="instalarCerrar" type="button" aria-label="Cerrar">×</button>
    </div>
    <!-- Dirvoz (Apps Script) va adentro. "allow" deja usar ubicación, cámara y portapapeles (igual que en Android). -->
    <iframe id="app" title="Dirvoz"
      allow="geolocation *; camera *; microphone *; clipboard-read *; clipboard-write *; autoplay *; fullscreen *; web-share *"
      allowfullscreen></iframe>
  </div>

  <div id="splash" aria-hidden="true">
    <div class="centro">
      <div class="ondas"><span class="onda"></span><span class="onda"></span><span class="onda"></span></div>
      <div class="brillo"></div>
      <img class="logo" src="dv_logo.png" alt="">
    </div>
    <img class="marca" src="dv_marca.png" alt="dirvoz">
    <p class="frase">Habla con quien tienes cerca</p>
    <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
    <p class="pie">FEDDE APPS</p>
  </div>

  <div id="sin" role="alert" hidden>
    <img src="dv_logo.png" alt="Dirvoz">
    <b>Sin conexión</b>
    <span>Revisa tu internet y vuelve a intentarlo.</span>
    <button type="button" id="reintentar">Reintentar</button>
  </div>

  <div id="aviso" role="alert" hidden></div>

  <script>
  (function () {
    "use strict";

    // ═══════════════════════ CONFIGURACIÓN ═══════════════════════
    // URL /exec de Dirvoz (la misma de URL_APP en MainActivity.kt)
    var EXEC = "https://script.google.com/macros/s/AKfycbzUjG461B3dOJC32K5z1oNgWkfyzGJGjrGQrsqs8y29vrPpHe49grrTAuOv7yNIW9N2kA/exec";
    // Cliente web de Google de Dirvoz ("Dirvoz Web", el mismo GOOGLE_CLIENT_ID de Code.gs)
    var CLIENT_ID = "637174056486-9crmqqskk5r06lr4qrg1lri1joua7nl5.apps.googleusercontent.com";
    // Dirección EXACTA de esta página (registrada en Google Cloud como URI de redireccionamiento)
    var URL_ESTA_APP = "https://feddeapps-ux.github.io/dirvoz/app/";
    // ═════════════════════════════════════════════════════════════

    var K_SESION = "DVW_SESION_V1", K_OAUTH = "DVW_OAUTH_V1", K_INSTALAR = "DVW_INSTALAR_CERRADO";
    var frame = document.getElementById("app");
    var appWin = null, appOrigen = "", vivo = false, listo = false, vigia = null, tInicio = Date.now();

    function $(id) { return document.getElementById(id); }
    function leer(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
    function escribir(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    var avisoT = null;
    function aviso(msg) { var a = $("aviso"); a.textContent = msg; a.hidden = false; clearTimeout(avisoT); avisoT = setTimeout(function () { a.hidden = true; }, 5500); }

    // ───────── Splash ─────────
    var splashT = null;
    function ocultarSplash() {
      clearTimeout(splashT);
      var espera = Math.max(0, 1300 - (Date.now() - tInicio));   // deja ver la animación de entrada
      splashT = setTimeout(function () { $("splash").classList.add("fuera"); }, espera);
    }
    function mostrarSplash() {
      tInicio = Date.now();
      $("splash").classList.remove("fuera");
      clearTimeout(splashT);
      splashT = setTimeout(function () { $("splash").classList.add("fuera"); }, 15000);   // red de seguridad
    }

    // Envía un mensaje a Dirvoz (está 2–3 iframes más adentro, se recorren todos) — igual que en Android
    function enviar(msg) {
      function recorrer(w, nivel) {
        if (!w || nivel > 5) return;
        try { w.postMessage(msg, "*"); } catch (e) {}
        try { for (var i = 0; i < w.frames.length; i++) recorrer(w.frames[i], nivel + 1); } catch (e) {}
      }
      recorrer(frame.contentWindow, 0);
    }
    window.dvEnviar = enviar;   // lo usa el motor de voz
    // Mensajes privados (sesión): solo a la ventana de Dirvoz que saludó
    function aDirvoz(msg) { if (appWin && appOrigen) { try { appWin.postMessage(msg, appOrigen); } catch (e) {} } }

    // ───────── Cargar Dirvoz ─────────
    function mostrarSin() { $("sin").hidden = false; $("splash").classList.add("fuera"); }
    function ocultarSin() { $("sin").hidden = true; }
    function cargar(url) {
      vivo = false; listo = false;
      ocultarSin();
      if (!navigator.onLine) { mostrarSin(); return; }
      mostrarSplash();
      frame.src = url || EXEC;
      clearTimeout(vigia);
      vigia = setTimeout(function () { if (!vivo) mostrarSin(); }, 25000);   // si no responde en 25 s
    }
    $("reintentar").addEventListener("click", function () { if (!navigator.onLine) { aviso("Todavía no hay conexión."); return; } cargar(EXEC); });
    window.addEventListener("online", function () { if (!$("sin").hidden) cargar(EXEC); });

    // ───────── Inicio de sesión con Google ─────────
    // Esta página sale a Google y Google vuelve aquí con un ID token (#id_token=…);
    // Code.gs lo verifica igual que en la app Android (doGet ?idToken=).
    function azar() {
      var a = new Uint8Array(16); (window.crypto || window.msCrypto).getRandomValues(a);
      return Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    }
    function iniciarGoogle() {
      var estado = azar(), nonce = azar();
      escribir(K_OAUTH, { estado: estado, nonce: nonce, t: Date.now() });
      var p = { client_id: CLIENT_ID, redirect_uri: URL_ESTA_APP, response_type: "id_token",
        scope: "openid email profile", nonce: nonce, state: estado, prompt: "select_account" };
      var qs = Object.keys(p).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(p[k]); }).join("&");
      mostrarSplash();
      location.assign("https://accounts.google.com/o/oauth2/v2/auth?" + qs);
    }
    function datosToken(jwt) {
      try {
        var b = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        while (b.length % 4) b += "=";
        return JSON.parse(decodeURIComponent(escape(atob(b))));
      } catch (e) { return null; }
    }
    function urlInicial() {
      var h = location.hash ? location.hash.slice(1) : "";
      if (!/(^|&)(id_token|error)=/.test(h)) return EXEC;
      var prm = {};
      h.split("&").forEach(function (par) {
        var i = par.indexOf("=");
        if (i > 0) prm[decodeURIComponent(par.slice(0, i))] = decodeURIComponent(par.slice(i + 1).replace(/\+/g, " "));
      });
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      var g = leer(K_OAUTH); escribir(K_OAUTH, null);
      if (prm.error) { if (prm.error !== "access_denied") setTimeout(function () { aviso("Google: " + prm.error); }, 1500); return EXEC; }
      if (!g || prm.state !== g.estado || Date.now() - g.t > 30 * 60000) {
        setTimeout(function () { aviso("El inicio con Google expiró. Vuelve a intentarlo."); }, 1500); return EXEC;
      }
      var tok = prm.id_token, d = datosToken(tok);
      if (!d || d.aud !== CLIENT_ID || d.nonce !== g.nonce) {
        setTimeout(function () { aviso("La respuesta de Google no es válida. Vuelve a intentarlo."); }, 1500); return EXEC;
      }
      return EXEC + "?idToken=" + encodeURIComponent(tok) + "&v=" + Date.now();
    }

    // ───────── Mensajes de Dirvoz (solo desde el dominio de Apps Script) ─────────
    function esOrigenApp(o) { return /^https:\/\/[\w.-]+\.googleusercontent\.com$/i.test(String(o || "")); }
    window.addEventListener("message", function (e) {
      if (!esOrigenApp(e.origin)) return;
      var d = e.data;
      if (!d || typeof d !== "object" || !d.fr) return;
      switch (d.fr) {
        case "hola":                    // Dirvoz cargó y saluda
          appWin = e.source; appOrigen = e.origin;
          vivo = true; clearTimeout(vigia); ocultarSin();
          aDirvoz({ fr: "envoltorio", url: URL_ESTA_APP, sesion: leer(K_SESION) });
          // (si Apps Script aún no tiene la versión nueva, no avisa "listo": se quita igual)
          setTimeout(function () { if (!listo) { ocultarSplash(); prepararAtras(); } }, 4000);
          break;
        case "listo":                   // Dirvoz ya se dibujó
          listo = true;
          ocultarSplash(); prepararAtras();
          setTimeout(revisarInstalar, 1800);
          break;
        case "sesion":
          escribir(K_SESION, (d.sesion && d.sesion.token) ? d.sesion : null);
          break;
        case "google":                  // botón "Continuar con Google"
          iniciarGoogle();
          break;
        case "ir":                      // si es Dirvoz se queda adentro; si no, afuera
          var u = String(d.url || "");
          if (u.indexOf(EXEC) === 0) cargar(u);
          else if (/^https:\/\/accounts\.google\.com\//.test(u)) location.assign(u);
          else if (/^https:\/\//.test(u)) window.open(u, "_blank", "noopener");
          break;
        case "atrasRespuesta":
          respuestaAtras(d);
          break;
      }
    });

    // ───────── Botón ATRÁS (Android / navegador): se le pregunta a Dirvoz ─────────
    var atrasListo = false, atrasId = 0, atrasT = null, saliendo = false;
    function prepararAtras() {
      if (atrasListo) return;
      atrasListo = true;
      try { history.pushState({ dv: 1 }, ""); } catch (e) {}
    }
    window.addEventListener("popstate", function () {
      if (!atrasListo || saliendo) return;
      var id = ++atrasId;
      enviar({ fr: "atras", id: id });
      clearTimeout(atrasT);
      atrasT = setTimeout(function () { if (id === atrasId) salir(); }, 900);
    });
    function respuestaAtras(d) {
      if (Number(d.id) !== atrasId) return;
      clearTimeout(atrasT); atrasId++;
      if (d.manejado) { try { history.pushState({ dv: 1 }, ""); } catch (e) {} } else salir();
    }
    function salir() { saliendo = true; try { history.back(); } catch (e) {} }

    // ───────── Instalar (Android, computador y iPhone) ─────────
    var promptInstalar = null;
    function instalada() { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
    function esIOS() { var ua = navigator.userAgent || ""; return /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1); }
    function revisarInstalar() {
      var t = leer(K_INSTALAR);
      if (instalada() || (t && Date.now() - t < 7 * 86400000)) return;
      if (promptInstalar) {
        $("instalarTexto").innerHTML = "<b>Instala Dirvoz</b> en tu teléfono o computador y ábrela como una app.";
        $("instalarBtn").hidden = false; $("instalar").hidden = false;
      } else if (esIOS()) {
        $("instalarTexto").innerHTML = "<b>Instala Dirvoz:</b> toca " +
          '<svg class="compartir-ios" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>' +
          " <b>Compartir</b> y luego <b>«Agregar a inicio»</b>.";
        $("instalarBtn").hidden = true; $("instalar").hidden = false;
      }
    }
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); promptInstalar = e; if (listo) revisarInstalar(); });
    window.addEventListener("appinstalled", function () { $("instalar").hidden = true; promptInstalar = null; });
    $("instalarBtn").addEventListener("click", function () {
      if (!promptInstalar) return;
      promptInstalar.prompt();
      promptInstalar.userChoice.then(function () { promptInstalar = null; $("instalar").hidden = true; });
    });
    $("instalarCerrar").addEventListener("click", function () { $("instalar").hidden = true; escribir(K_INSTALAR, Date.now()); });

    // ───────── Arranque ─────────
    if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    cargar(urlInicial());
  })();
  </script>

<script>
/* ═══════════════ 🎧 MOTOR DE VOZ · Conversar con audífonos ═══════════════
   Vive AQUÍ (página local de la app Android) porque Apps Script no deja usar el micrófono.
   Dirvoz (el iframe) le da órdenes con postMessage {fr:"voz", cmd:...} y este motor
   le contesta con {fr:"vozEv", tipo:...}. El audio va directo entre los dos teléfonos (WebRTC,
   cifrado); si la red no lo permite, pasa por el servidor TURN de Cloudflare.
   Nada se graba ni se guarda. */
(function () {
  "use strict";
  var VERSION = 1;
  var pc = null, mic = null, charla = "", rol = "", n = 0, ice = [], silenciado = false;
  var activa = false, conectado = false, via = "", tInestable = null, cola = Promise.resolve();
  var audio = document.createElement("audio");
  audio.autoplay = true; audio.setAttribute("playsinline", ""); audio.style.display = "none";
  document.body.appendChild(audio);

  function AB() { try { return window.AndroidBridge || null; } catch (e) { return null; } }
  function nativo(on) { var a = AB(); try { if (a && typeof a.vozAudio === "function") a.vozAudio(!!on); } catch (e) {} }
  function avisar(o) { o.fr = "vozEv"; o.charla = charla; try { if (window.dvEnviar) window.dvEnviar(o); } catch (e) {} }
  // Las órdenes se hacen de a una, en orden (el micrófono tarda en abrir)
  function enCola(fn) { cola = cola.then(fn).catch(function (err) { avisar({ tipo: "error", msg: mensaje(err) }); }); }

  function mensaje(err) {
    var nom = err && err.name;
    if (nom === "NotAllowedError" || nom === "SecurityError") return "Dirvoz necesita permiso para usar el micrófono. Actívalo en Ajustes del teléfono → Apps → Dirvoz → Permisos.";
    if (nom === "NotFoundError") return "No encontramos un micrófono en este teléfono.";
    if (nom === "NotReadableError") return "El micrófono lo está usando otra app (por ejemplo una llamada). Ciérrala e intenta de nuevo.";
    return "No se pudo iniciar el audio" + (err && err.message ? ": " + err.message : ".");
  }

  function pedirMic() {
    if (mic && mic.getAudioTracks().some(function (t) { return t.readyState === "live"; })) return Promise.resolve(mic);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error("este teléfono no permite usar el micrófono aquí"));
    return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false })
      .then(function (s) { mic = s; aplicarSilencio(); return s; });
  }
  function aplicarSilencio() { if (mic) mic.getAudioTracks().forEach(function (t) { t.enabled = !silenciado; }); }

  function cerrarPc() {
    clearTimeout(tInestable);
    if (pc) { try { pc.ontrack = pc.onconnectionstatechange = pc.oniceconnectionstatechange = null; pc.close(); } catch (e) {} }
    pc = null; conectado = false;
  }

  function nuevaConexion() {
    cerrarPc();
    var p = new RTCPeerConnection({ iceServers: ice, bundlePolicy: "max-bundle" });
    pc = p;
    mic.getAudioTracks().forEach(function (t) { p.addTrack(t, mic); });
    p.ontrack = function (e) {
      if (p !== pc) return;
      audio.srcObject = (e.streams && e.streams[0]) || new MediaStream([e.track]);
      var r = audio.play(); if (r && r.catch) r.catch(function () {});
    };
    function revisar() {
      if (p !== pc) return;
      var s = p.connectionState || p.iceConnectionState;
      if (s === "connected" || s === "completed") {
        clearTimeout(tInestable);
        if (!conectado) { conectado = true; queVia(p); }
      } else if (s === "disconnected") {
        if (conectado) avisar({ tipo: "inestable" });
        conectado = false;
        clearTimeout(tInestable);
        tInestable = setTimeout(function () { if (p === pc && !conectado) avisar({ tipo: "fallo", n: n }); }, 8000);
      } else if (s === "failed") {
        conectado = false; clearTimeout(tInestable);
        avisar({ tipo: "fallo", n: n });
      }
    }
    p.onconnectionstatechange = revisar;
    p.oniceconnectionstatechange = revisar;
    return p;
  }

  // ¿El audio va directo o por el servidor de Cloudflare? (solo informativo)
  function queVia(p) {
    via = "";
    var listo = function () { avisar({ tipo: "conectado", via: via, n: n }); };
    try {
      p.getStats().then(function (st) {
        var par = null, loc = {};
        st.forEach(function (r) { if (r.type === "transport" && r.selectedCandidatePairId) par = st.get(r.selectedCandidatePairId); });
        if (!par) st.forEach(function (r) { if (r.type === "candidate-pair" && r.nominated && r.state === "succeeded") par = r; });
        if (par) loc = st.get(par.localCandidateId) || {};
        via = loc.candidateType === "relay" ? "servidor" : loc.candidateType ? "directo" : "";
        listo();
      }, listo);
    } catch (e) { listo(); }
  }

  // Sin "trickle": se espera a tener todos los caminos posibles y se manda todo junto (el cartero es lento)
  function esperarCandidatos(p) {
    return new Promise(function (ok) {
      if (p.iceGatheringState === "complete") { ok(); return; }
      var t = setTimeout(ok, 3500);
      p.addEventListener("icegatheringstatechange", function () { if (p.iceGatheringState === "complete") { clearTimeout(t); ok(); } });
    });
  }

  function hacerOferta(nuevoN) {
    return pedirMic().then(function () {
      n = nuevoN;
      var p = nuevaConexion();
      return p.createOffer().then(function (o) { return p.setLocalDescription(o); })
        .then(function () { return esperarCandidatos(p); })
        .then(function () { if (p === pc) avisar({ tipo: "sdp", kind: "offer", n: n, sdp: p.localDescription.sdp }); });
    });
  }

  function recibirOferta(sdp, nOferta) {
    return pedirMic().then(function () {
      // La misma oferta otra vez (por ejemplo Dirvoz se recargó): no se corta lo que ya funciona
      if (pc && nOferta === n && pc.remoteDescription) return;
      n = nOferta;
      var p = nuevaConexion();
      return p.setRemoteDescription({ type: "offer", sdp: sdp })
        .then(function () { return p.createAnswer(); })
        .then(function (a) { return p.setLocalDescription(a); })
        .then(function () { return esperarCandidatos(p); })
        .then(function () { if (p === pc) avisar({ tipo: "sdp", kind: "answer", n: n, sdp: p.localDescription.sdp }); });
    });
  }

  function recibirRespuesta(sdp, nResp) {
    if (!pc || nResp !== n || pc.signalingState !== "have-local-offer") return Promise.resolve();
    return pc.setRemoteDescription({ type: "answer", sdp: sdp });
  }

  function colgar() {
    activa = false; cerrarPc();
    if (mic) { mic.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); mic = null; }
    try { audio.srcObject = null; } catch (e) {}
    silenciado = false; n = 0; rol = ""; via = "";
    nativo(false);
  }

  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.fr !== "voz") return;
    // Solo obedece a Dirvoz (Apps Script se sirve desde *.googleusercontent.com)
    if (!/^https:\/\/[\w.-]+\.googleusercontent\.com$/i.test(String(e.origin || ""))) return;
    var cmd = String(d.cmd || "");
    if (cmd === "hola") {
      avisar({ tipo: "listo", version: VERSION, activa: activa, rol: rol, n: n, conectado: conectado, silenciado: silenciado, via: via });
      return;
    }
    if (cmd === "mic") {             // pide el permiso del micrófono con tiempo (mientras el otro acepta)
      enCola(function () { return pedirMic().then(function () { avisar({ tipo: "mic", ok: true }); }); });
      return;
    }
    if (cmd === "iniciar") {
      charla = String(d.charla || ""); rol = d.rol === "oferta" ? "oferta" : "respuesta";
      ice = Array.isArray(d.ice) && d.ice.length ? d.ice : [{ urls: ["stun:stun.cloudflare.com:3478", "stun:stun.l.google.com:19302"] }];
      activa = true; nativo(true);
      enCola(function () {
        return pedirMic().then(function () {
          avisar({ tipo: "mic", ok: true });
          if (rol === "oferta") return hacerOferta(Math.max(1, Number(d.n) || 1));
        });
      });
      return;
    }
    if (!activa && cmd !== "colgar") return;
    if (cmd === "oferta") enCola(function () { return hacerOferta(Number(d.n) || n + 1); });
    else if (cmd === "remota" && d.kind === "offer") enCola(function () { return recibirOferta(String(d.sdp || ""), Number(d.n) || 1); });
    else if (cmd === "remota" && d.kind === "answer") enCola(function () { return recibirRespuesta(String(d.sdp || ""), Number(d.n) || 0); });
    else if (cmd === "silenciar") { silenciado = !!d.si; aplicarSilencio(); }
    else if (cmd === "colgar") { cola = Promise.resolve(); colgar(); }
  });
  window.addEventListener("pagehide", colgar);
})();
</script>
</body>
</html>
